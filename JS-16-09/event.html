<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Få knappar att reagera</title>
  <link rel="stylesheet" href="event.css">
  <script src="event.js" defer></script>
</head>

<body>

  <h1>Få knappar att reagera</h1>

  <!-- 1. Ändra textContent -->
  <p id="text">Gammal text</p>
  <button id="textBtn">Ändra text</button>


  <!-- 2. Toggle en klass -->
  <p id="highlightText">Den här texten kan highlightas</p>
  <button id="highlightBtn">Highlight</button>


  <!-- 3. Skapa ett nytt element -->
  <div id="container"></div>
  <button id="createBtn">Skapa element</button>


  <!-- 4. Ta bort ett element -->
  <p id="removeText">Det här elementet kan tas bort</p>
  <button id="removeBtn">Ta bort</button>


  <!-- Bonus 2 -->
  <p id="hoverText">För musen över mig</p>


  <!-- Bonus 3 -->
  <button id="manyBtn">Skapa många</button>
  

</body>
</html>
